services:
  backend:
    image: harbor.habbora.com.br/supervisor/backend:latest
    container_name: supervisor-backend
    pull_policy: always
    ports:
      - "4001:4001"
    volumes:
      # Volume para dados da aplicação
      - supervisor-data:/app/data
      # Volume para banco de dados
      - supervisor-database:/app/database
      # Volume para logs
      - supervisor-logs:/app/logs
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    privileged: true
    user: "0:0"
    networks:
      - supervisor-network

  frontend:
    image: harbor.habbora.com.br/supervisor/frontend:latest
    container_name: supervisor-frontend
    pull_policy: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:4001
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - supervisor-network

networks:
  supervisor-network:
    driver: bridge

volumes:
  # Volume principal para dados da aplicação
  supervisor-data:
    driver: local
  # Volume para banco de dados
  supervisor-database:
    driver: local
  # Volume para logs (opcional)
  supervisor-logs:
    driver: local
  # Volume para cache do frontend (opcional)
  supervisor-frontend-cache:
    driver: local
